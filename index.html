/* Shopper navigation deliberately keeps Studio private to creator accounts. */
.nav-link[data-nav="studio"],.bottom-nav [data-nav="studio"]{display:none}
.creator-entry{margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--soft)}
.creator-entry h3{font-family:var(--display);font-size:22px;font-weight:500;margin:4px 0}
.creator-entry p{font-size:12px;color:var(--muted);margin:0}
.studio-screen{display:flex;flex-direction:column;gap:20px}
.studio-screen-header{display:flex;justify-content:space-between;align-items:end;gap:20px}
.studio-screen-header h1{font-family:var(--display);font-weight:500;font-size:42px;letter-spacing:-.06em;margin:5px 0}
.studio-screen-header p{margin:0;color:var(--muted);font-size:12px}
.studio-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.studio-toolbar .filter{background:#fff}
.creator-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.creator-grid.two{grid-template-columns:1.25fr .75fr}
.creator-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px}
.creator-card h3{font-size:14px;margin:0 0 14px}
.creator-card h4{font-size:12px;margin:0 0 6px}
.creator-card p{font-size:12px;color:var(--muted);margin:5px 0}
.creator-kpi{font-family:var(--display);font-size:29px;font-weight:500;margin:5px 0}
.creator-kpi-note{font-size:10px;color:#648160}
.creator-chart{height:180px;display:flex;align-items:end;gap:10px;border-bottom:1px solid var(--line);padding:15px 4px 22px}
.creator-chart span{flex:1;background:#111;border-radius:5px 5px 0 0;min-height:12px;position:relative}
.creator-chart span::after{content:attr(data-label);position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:#999}
.creator-list{display:flex;flex-direction:column}
.creator-list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #f0f0f0;font-size:12px}
.creator-list-row:first-child{border-top:0}
.creator-list-row>div:first-child{flex:1}
.creator-list-row small{display:block;color:#999;font-size:10px;margin-top:2px}
.creator-status{border-radius:999px;background:#f1f1ee;padding:5px 9px;font-size:10px}
.creator-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.creator-form label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700}
.creator-form label.full{grid-column:1/-1}
.creator-form input,.creator-form textarea,.creator-form select{border:1px solid var(--line);border-radius:8px;padding:11px;background:#fff;outline:0}
.creator-form textarea{min-height:105px;resize:vertical}
.creator-form input:focus,.creator-form textarea:focus,.creator-form select:focus{border-color:#111}
.creator-toggle{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid #f0f0f0;font-size:12px}
.creator-toggle:first-child{border-top:0}
.toggle{width:39px;height:23px;border-radius:99px;background:#ddd;padding:3px;transition:.2s}.toggle.on{background:#111}.toggle i{display:block;width:17px;height:17px;background:#fff;border-radius:50%;transition:.2s}.toggle.on i{transform:translateX(16px)}
.creator-message-layout{display:grid;grid-template-columns:250px 1fr;min-height:410px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.creator-conversations{border-right:1px solid var(--line);padding:12px}.creator-conversation{padding:12px;border-radius:9px;font-size:12px;cursor:pointer}.creator-conversation.active,.creator-conversation:hover{background:#f2f2ef}.creator-conversation small{display:block;color:#999;margin-top:3px}.creator-chat{display:flex;flex-direction:column;padding:18px}.creator-chat-body{flex:1}.bubble{max-width:70%;padding:10px 12px;border-radius:12px;margin:8px 0;font-size:12px;background:#f0f0ee}.bubble.mine{margin-left:auto;background:#111;color:#fff}.creator-chat-form{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}.creator-chat-form input{flex:1;border:1px solid var(--line);border-radius:99px;padding:0 14px}
.creator-preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fafaf8}.creator-preview-cover{height:130px;background:#ddd;overflow:hidden}.creator-preview-cover img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}.creator-preview-body{padding:18px}.creator-preview-logo{width:54px;height:54px;border-radius:50%;object-fit:cover;margin-top:-42px;border:4px solid #fafaf8;filter:grayscale(1)}
@media(max-width:760px){.studio-screen-header{align-items:start;flex-direction:column}.studio-screen-header h1{font-size:35px}.creator-grid,.creator-grid.two{grid-template-columns:1fr}.creator-form{grid-template-columns:1fr}.creator-form label.full{grid-column:auto}.creator-message-layout{grid-template-columns:1fr}.creator-conversations{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow:auto}.creator-conversation{min-width:150px}.creator-chat{min-height:300px}}

function storefront(){const s=state.store?storeByUser(state.store):stores[0];const storeProducts=products.filter(p=>p.store===s.username);return `<main class="page view"><div class="view-title"><div><span class="eyebrow">E SHOP / PUBLIC STORE</span><h1>Storefronts</h1></div><button class="btn btn-dark" data-action="shop">Browse marketplace ${icon('arrow',15)}</button></div><section class="store-hero"><div class="store-cover"><img src="${s.cover}" alt="${s.name} store cover"></div><div class="store-info"><img class="store-logo" src="${s.logo}" alt="${s.name} logo"><div class="store-copy"><h1>${s.name}</h1><p>${s.username} · ${s.desc}</p></div><div class="store-stat">${s.followers} followers · ★ ${s.rating} · ${storeProducts.length||12} products</div><button class="btn btn-dark" data-action="follow">Follow store</button></div><div class="store-tabs"><button class="store-tab active">HOME</button><button class="store-tab">PRODUCTS</button><button class="store-tab">CATEGORIES</button><button class="store-tab">OFFERS</button><button class="store-tab">ABOUT</button></div></section><div class="section-heading"><div><span class="eyebrow">Featured from ${s.username}</span><h2>Best sellers</h2></div><button class="text-link" data-action="shop">View collection</button></div><div class="product-grid">${(storeProducts.length?storeProducts:products.slice(0,4)).map(productCard).join('')}</div><div class="section-heading"><div><span class="eyebrow">Discover more</span><h2>Independent stores</h2></div></div><div class="stores-row">${stores.map(x=>`<button class="store-card" data-store="${x.username}"><img src="${x.logo}" alt="${x.name} logo"><span><strong>${x.name}</strong><span>${x.username} · ${x.rating} rating</span></span>${icon('arrow',14)}</button>`).join('')}</div></main>`}

function studioNav(links){return `<span class="eyebrow">Seller studio</span><h2 style="font-family:var(--display);font-weight:500;font-size:25px;margin:8px 0 25px">Urban Wear</h2><div class="studio-label">Manage your shop</div>${links.map(x=>`<button class="studio-link ${state.studio===x?'active':''}" data-studio="${x}">${x==='Overview'?icon('chart',14):x==='Products'?icon('box',14):icon('plus',14)}${x}</button>`).join('')}`}
function studioProducts(links){return `<main class="page view"><div class="studio-layout"><aside class="studio-side">${studioNav(links)}</aside><section class="studio-content"><div class="studio-top"><div><span class="eyebrow">Catalog / 42 products</span><h1>Products</h1><p>Keep your storefront fresh and in stock.</p></div><button class="btn btn-dark" data-studio="Add product">${icon('plus',15)} Add product</button></div><div class="filter-row"><input class="filter" placeholder="Search catalog" style="min-width:220px"><button class="filter active">All products</button><button class="filter">In stock</button><button class="filter">Low stock</button></div><div class="panel">${products.slice(0,8).map(p=>`<div class="order" style="grid-template-columns:2fr 1fr .8fr .8fr .7fr"><span style="display:flex;align-items:center;gap:9px"><img src="${p.img}" style="width:42px;height:42px;object-fit:cover;border-radius:7px"><strong>${p.name}<small style="display:block;color:#999;font-weight:400">${p.store} · SKU-00${p.id}</small></strong></span><span>${p.cat}</span><span>${money(p.price)}</span><span>${p.id===6?'Low stock':'In stock'}</span><button class="text-link" data-product="${p.id}">View</button></div>`).join('')}</div></section></div></main>`}
function studio(){const links=['Overview','Products','Add product','Orders','Customers','Analytics','Storefront','Categories','Offers','Inventory','Messages','Settings'];if(state.studio==='Products')return studioProducts(links);return `<main class="page view"><div class="studio-layout"><aside class="studio-side">${studioNav(links)}</aside><section class="studio-content"><div class="studio-top"><div><span class="eyebrow">Tuesday, 29 September 2026</span><h1>${state.studio}</h1><p>Here’s what’s happening with your store today.</p></div><button class="btn btn-dark" data-studio="Add product">${icon('plus',15)} Add product</button></div><div class="stats"><div class="stat"><small>Total sales</small><strong>KSh 284,650</strong><span>↗ 18.2% this month</span></div><div class="stat"><small>Orders</small><strong>148</strong><span>↗ 12.4% this month</span></div><div class="stat"><small>Products</small><strong>42</strong><span>↗ 4 new this week</span></div><div class="stat"><small>Customers</small><strong>1,284</strong><span>↗ 9.7% this month</span></div></div><div class="studio-panels"><div class="panel"><h3>Revenue overview <span style="float:right;color:#888;font-weight:400;font-size:10px">Last 7 days · KSh</span></h3><div class="chart">${[44,67,52,84,62,92,76].map((n,i)=>`<span class="bar" style="height:${n}%" data-label="${['M','T','W','T','F','S','S'][i]}"></span>`).join('')}</div></div><div class="panel"><h3>Top products <span style="float:right;font-size:10px;color:#888">This month</span></h3>${products.slice(0,4).map((p,i)=>`<div style="display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f1f1"><img src="${p.img}" style="width:35px;height:35px;object-fit:cover;border-radius:6px"><span style="font-size:11px;flex:1">${p.name}<small style="display:block;color:#999">${['42 sold','36 sold','28 sold','22 sold'][i]}</small></span><strong style="font-size:11px">${money(p.price)}</strong></div>`).join('')}</div></div><div class="panel orders"><h3>Recent orders <button class="text-link" style="float:right">View all</button></h3><div class="order" style="color:#999;font-size:10px"><span>ORDER</span><span>CUSTOMER</span><span>AMOUNT</span><span>STATUS</span></div>${[['#ES-1048','Njeri Wanjiku','KSh 12,400','Shipped'],['#ES-1047','Brian Otieno','KSh 8,600','Processing'],['#ES-1046','Amina Yusuf','KSh 22,100','Delivered'],['#ES-1045','John Kamau','KSh 4,200','Confirmed']].map(o=>`<div class="order"><strong>${o[0]}</strong><span>${o[1]}</span><span>${o[2]}</span><span class="pill">${o[3]}</span></div>`).join('')}</div></section></div></main>`}
function account(){return `<main class="page view"><div class="view-title"><div><span class="eyebrow">Your account</span><h1>Welcome back, Amina.</h1></div><span class="avatar" style="width:50px;height:50px">AM</span></div><div class="stores-row"><div class="panel"><span class="eyebrow">Orders</span><h2 style="font-family:var(--display);font-size:28px;font-weight:500">12 orders</h2><p style="color:#777;font-size:12px">Track deliveries and see your purchase history.</p><button class="text-link">View orders →</button></div><div class="panel"><span class="eyebrow">Saved pieces</span><h2 style="font-family:var(--display);font-size:28px;font-weight:500">${state.saved.size} saved</h2><p style="color:#777;font-size:12px">Your shortlist, all in one place.</p><button class="text-link">View saved →</button></div><div class="panel"><span class="eyebrow">Following</span><h2 style="font-family:var(--display);font-size:28px;font-weight:500">8 stores</h2><p style="color:#777;font-size:12px">Stay close to your favorite sellers.</p><button class="text-link">View following →</button></div></div><div class="section-heading"><div><span class="eyebrow">Your saved edit</span><h2>Saved products</h2></div></div><div class="product-grid">${products.filter(p=>state.saved.has(p.id)).map(productCard).join('')||'<div class="empty" style="grid-column:1/-1">Save products as you browse and they will appear here.</div>'}</div></main>`}
function render(){const content=state.view==='feed'?feed():state.view==='storefront'?storefront():state.view==='detail'?detail():state.view==='account'?account():studio();app.innerHTML=`<div class="shell">${header()}${content}<nav class="bottom-nav"><button class="${state.view==='feed'?'active':''}" data-nav="feed">${icon('search',16)}Feed</button><button class="${state.view==='storefront'?'active':''}" data-nav="storefront">${icon('box',16)}Stores</button><button class="${state.view==='studio'?'active':''}" data-nav="studio">${icon('chart',16)}Studio</button><button data-modal="cart">${icon('bag',16)}Bag</button><button data-nav="account"><span class="avatar" style="width:22px;height:22px;font-size:8px">AM</span>Account</button></nav></div>`;bind()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.store=null;render();window.scrollTo(0,0)});document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{state.category=b.dataset.category;state.view='feed';render()});document.querySelectorAll('[data-product]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-save]'))return;state.product=b.dataset.product;state.view='detail';render();window.scrollTo(0,0)});document.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>{state.store=b.dataset.store;state.view='storefront';render();window.scrollTo(0,0)});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=Number(b.dataset.save);state.saved.has(id)?state.saved.delete(id):state.saved.add(id);localStorage.setItem('eshop-saved',JSON.stringify([...state.saved]));showToast(state.saved.has(id)?'Saved to your edit':'Removed from saved');render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.cart.push(Number(b.dataset.add));showToast('Added to your bag');render()});document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));document.querySelectorAll('[data-studio]').forEach(b=>b.onclick=()=>{state.view='studio';state.studio=b.dataset.studio;render();window.scrollTo(0,0)});document.querySelectorAll('[data-action="shop"]').forEach(b=>b.onclick=()=>{state.view='feed';state.category='All';render()});document.querySelectorAll('[data-action="all"]').forEach(b=>b.onclick=()=>{state.category='All';state.view='feed';render()});document.querySelectorAll('[data-action="back"]').forEach(b=>b.onclick=()=>{state.view='feed';render()});document.querySelectorAll('[data-action="follow"]').forEach(b=>b.onclick=()=>showToast('You are now following this store'));const input=document.querySelector('#global-search');if(input)input.oninput=()=>{state.search=input.value;if(state.view!=='feed')state.view='feed';render();const next=document.querySelector('#global-search');next.focus();next.setSelectionRange(next.value.length,next.value.length)}}
function openModal(type){const items=state.cart.map(id=>productById(id)).filter(Boolean);const wrap=document.createElement('div');wrap.className='modal-backdrop';const modal=document.createElement('div');modal.className='modal';if(type==='cart'){const rows=items.length?items.map(p=>`<div class="cart-row"><img src="${p.img}" alt="${p.name}"><div><strong>${p.name}</strong><span>${p.store} · ${money(p.price)}</span></div><button class="text-link" data-remove="${p.id}">Remove</button></div>`).join(''):'<div class="empty">Your bag is waiting for something good.</div>';const total=items.reduce((sum,p)=>sum+p.price,0);modal.innerHTML=`<div class="modal-header"><div><span class="eyebrow">Your selection</span><h2>Your bag</h2></div><button class="close" data-close>×</button></div>${rows}${items.length?`<div class="modal-footer"><strong>Total · ${money(total)}</strong><button class="btn btn-dark" data-checkout>Checkout ${icon('arrow',14)}</button></div>`:''}`}else{modal.innerHTML=`<div class="modal-header"><div><span class="eyebrow">Stay in the loop</span><h2>Notifications</h2></div><button class="close" data-close>×</button></div><div class="notification"><i></i><span><strong>Order ES-1048 shipped</strong><br><small style="color:#999">Your Kinetic Motion order is on the way.</small></span></div><div class="notification"><i></i><span><strong>New from @ateliernine</strong><br><small style="color:#999">The Sculpt collection just landed.</small></span></div><div class="notification"><i></i><span><strong>Weekend offer unlocked</strong><br><small style="color:#999">Enjoy 15% off selected home pieces.</small></span></div>`}wrap.append(modal);document.body.append(wrap);wrap.onclick=e=>{if(e.target===wrap||e.target.closest('[data-close]'))wrap.remove()};wrap.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(id=>id!==Number(b.dataset.remove));wrap.remove();openModal('cart');render()});const checkout=wrap.querySelector('[data-checkout]');if(checkout)checkout.onclick=()=>{state.cart=[];modal.innerHTML=`<div class="modal-header"><div><span class="eyebrow">Order confirmed</span><h2>Thank you, Amina.</h2></div><button class="close" data-close>×</button></div><p style="color:#777">Your order <strong>#ES-1049</strong> is confirmed. We’ll send delivery updates to your notifications.</p><div class="panel" style="margin-top:17px"><strong>Estimated delivery</strong><br><span style="color:#777;font-size:12px">1–3 business days · Nairobi</span></div><div style="margin-top:17px"><button class="btn btn-dark" data-close>Continue shopping</button></div>`;modal.querySelector('[data-close]').onclick=()=>wrap.remove();render()}}
function showToast(message){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2200)}

const keepStudioPrivate = () => {
  document.querySelectorAll('.nav-link[data-nav="studio"],.bottom-nav [data-nav="studio"]').forEach(button => button.remove());
  if (state.view === 'account' && !document.querySelector('[data-creator-entry]')) {
    const title = document.querySelector('.view-title');
    if (title) {
      const entry = document.createElement('section');
      entry.className = 'creator-entry';
      entry.dataset.creatorEntry = 'true';
      entry.innerHTML = '<div><span class="eyebrow">For creators only</span><h3>Manage your store</h3><p>Open Creator Studio to manage products, orders, offers and analytics.</p></div><button class="btn btn-dark">Open Creator Studio</button>';
      entry.querySelector('button').onclick = () => { state.view = 'studio'; state.studio = 'Overview'; render(); window.scrollTo(0,0); };
      title.after(entry);
    }
  }
};
const privateStudioObserver = new MutationObserver(keepStudioPrivate);

openModal = function(type){
  const items=state.cart.map(id=>productById(id)).filter(Boolean); const wrap=document.createElement('div'); wrap.className='modal-backdrop'; const modal=document.createElement('div'); modal.className='modal';
  if(type==='cart'){
    const rows=items.length?items.map(p=>`<div class="cart-row"><img src="${p.img}" alt="${p.name}"><div><strong>${p.name}</strong><span>${p.store} · ${money(p.price)}</span></div><button class="text-link" data-remove="${p.id}">Remove</button></div>`).join(''):'<div class="empty">Your bag is waiting for something good.</div>';
    const total=items.reduce((sum,p)=>sum+p.price,0);
    modal.innerHTML=`<div class="modal-header"><div><span class="eyebrow">Your selection</span><h2>Your bag</h2></div><button class="close" data-close>×</button></div>${rows}${items.length?`<div class="modal-footer"><strong>Total · ${money(total)}</strong><button class="btn btn-dark" data-checkout>Checkout ${icon('arrow',14)}</button></div>`:''}`;
  } else modal.innerHTML=`<div class="modal-header"><div><span class="eyebrow">Stay in the loop</span><h2>Notifications</h2></div><button class="close" data-close>×</button></div><div class="notification"><i></i><span><strong>Order ES-1048 shipped</strong><br><small style="color:#999">Your Kinetic Motion order is on the way.</small></span></div><div class="notification"><i></i><span><strong>New from @ateliernine</strong><br><small style="color:#999">The Sculpt collection just landed.</small></span></div>`;
  wrap.append(modal);document.body.append(wrap);wrap.onclick=e=>{if(e.target===wrap||e.target.closest('[data-close]'))wrap.remove()};
  wrap.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(id=>id!==Number(b.dataset.remove));localStorage.setItem('eshop-cart',JSON.stringify(state.cart));wrap.remove();render();openModal('cart')});
  const checkout=wrap.querySelector('[data-checkout]');if(checkout)checkout.onclick=()=>{wrap.remove();state.view='checkout';render();window.scrollTo(0,0)};
};

document.addEventListener('submit',async e=>{
  if(e.target.id!=='checkout-form')return;
  e.preventDefault();
  if(!e.target.reportValidity())return;
  const data=new FormData(e.target);
  const items=state.cart.map(id=>productById(id)).filter(Boolean);
  const subtotal=items.reduce((sum,p)=>sum+p.price,0);
  const delivery=subtotal>=10000?0:350;
  const payment=data.get('payment');
  if(payment==='Paystack'){
    const submit=e.target.querySelector('button[type="submit"]');
    if(submit){submit.disabled=true;submit.textContent='Connecting to Paystack…';}
    try{
      const response=await fetch(apiUrl('/api/paystack/initialize'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
        email:data.get('email'),
        customer_name:data.get('name'),
        customer_phone:data.get('phone'),
        delivery_address:data.get('address'),
        city:data.get('city'),
        items:items.map(p=>({product_id:p.id,quantity:1}))
      })});
      const payload=await response.json();
      if(!response.ok||!payload.authorization_url)throw new Error(payload.error||'Could not start Paystack checkout.');
      sessionStorage.setItem('eshop-paystack-pending',JSON.stringify({reference:payload.reference,total:payload.total}));
      window.location.assign(payload.authorization_url);
    }catch(err){
      if(submit){submit.disabled=false;submit.textContent='Pay with Paystack · '+money(subtotal+delivery);}
      showToast(err.message||'Paystack checkout could not start.');
    }
    return;
  }
  state.lastOrder={number:`ES-${Math.floor(1000+Math.random()*8999)}`,total:subtotal+delivery,payment,items};
  state.cart=[];localStorage.removeItem('eshop-cart');state.view='confirmation';render();window.scrollTo(0,0);
});

"><div class="store-intro"><div class="store-about-card"><span class="eyebrow">The story</span><h2>'+s.name+'</h2><p>'+s.desc+' We make considered choices, work with trusted makers and keep the store close to the people who use it.</p><div class="store-policy"><div><small>Dispatch</small><strong>1–2 days</strong></div><div><small>Returns</small><strong>14 days</strong></div><div><small>Support</small><strong>Same day</strong></div></div></div><div class="store-about-card"><span class="eyebrow">Seller details</span><h2>Good to know</h2><p>Based in Nairobi · '+s.followers+' followers · ★ '+s.rating+' rating</p><p>Questions about a product? Use the message button or follow the store for new drops.</p><button class="btn btn-dark" data-action="follow">Follow '+s.username+'</button></div></div></div>';return '<main class="page view"><div class="view-title"><div><span class="eyebrow">E SHOP / PUBLIC STORE</span><h1>'+s.name+'</h1></div><button class="btn btn-dark" data-action="shop">Back to marketplace '+icon('arrow',15)+'</button></div><section class="store-hero"><div class="store-cover"><img src="'+s.cover+'" alt="'+s.name+' store cover"></div><div class="store-info"><img class="store-logo" src="'+s.logo+'" alt="'+s.name+' logo"><div class="store-copy"><h1>'+s.name+'</h1><p>'+s.username+' · '+s.desc+'</p></div><div class="store-stat">'+s.followers+' followers · ★ '+s.rating+' · '+ps.length+' products</div><button class="btn btn-dark" data-action="follow">Follow store</button></div><div class="store-tabs">'+['HOME','PRODUCTS','CATEGORIES','OFFERS','ABOUT'].map(t=>'<button class="store-tab '+(tab===t?'active':'')+'" data-store-tab="'+t+'">'+t+'</button>').join('')+'</div></section>'+content+'<div class="section-heading"><div><span class="eyebrow">Find another shop</span><h2>30 independent stores</h2></div></div><div class="all-stores-grid">'+stores.map(x=>'<button class="store-card-wide" data-store="'+x.username+'"><img src="'+x.logo+'" alt="'+x.name+' logo"><span><strong>'+x.name+'</strong><small>'+x.username+' · '+x.followers+' followers</small></span>'+icon('arrow',14)+'</button>').join('')+'</div></main>';}

document.addEventListener('click',e=>{const tab=e.target.closest('[data-store-tab]');if(tab){state.storeTab=tab.dataset.storeTab;render();window.scrollTo(0,0);}const next=e.target.closest('[data-carousel-next]'),prev=e.target.closest('[data-carousel-prev]'),go=e.target.closest('[data-carousel-go]');if(next){state.carouselIndex=(state.carouselIndex+1)%campaigns.length;render();}if(prev){state.carouselIndex=(state.carouselIndex-1+campaigns.length)%campaigns.length;render();}if(go){state.carouselIndex=Number(go.dataset.carouselGo);render();}const pause=e.target.closest('[data-carousel-pause]');if(pause){state.carouselPaused=!state.carouselPaused;render();}});

 if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
let deferredInstallPrompt=null;
const installIsStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const removeInstallPrompt=()=>document.querySelector('.install-prompt')?.remove();
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  if(installIsStandalone()||localStorage.getItem('eshop-install-dismissed')==='1')return;
  setTimeout(()=>{
    if(!deferredInstallPrompt||document.querySelector('.install-prompt'))return;
    const prompt=document.createElement('aside');
    prompt.className='install-prompt';
    prompt.innerHTML='<div class="install-prompt-icon">e</div><div class="install-prompt-copy"><strong>Install E SHOP</strong><span>Keep E SHOP on your home screen for faster access.</span><div class="install-prompt-actions"><button class="install-prompt-install" data-install>Install app</button><button class="install-prompt-dismiss" data-install-dismiss>Not now</button></div></div>';
    document.body.append(prompt);
    prompt.querySelector('[data-install]').onclick=async()=>{
      if(!deferredInstallPrompt)return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt=null;
      removeInstallPrompt();
    };
    prompt.querySelector('[data-install-dismiss]').onclick=()=>{
      localStorage.setItem('eshop-install-dismissed','1');
      deferredInstallPrompt=null;
      removeInstallPrompt();
    };
  },1200);
});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;removeInstallPrompt();});

<script>
(() => {
  async function hydrateFromD1() {
    try {
      const response = await fetch(apiUrl('/api/catalog'), { cache: 'no-store' });
      if (!response.ok) return;
      const data = await response.json();
      if (Array.isArray(data.products) && data.products.length) products.splice(0, products.length, ...data.products);
      if (Array.isArray(data.stores) && data.stores.length) stores.splice(0, stores.length, ...data.stores);
      if (Array.isArray(data.categories) && data.categories.length) categories.splice(0, categories.length, ...data.categories.map(name => ['◇', name]));
      render();
    } catch {
      // Static/local opening continues with the embedded catalog.
    }
  }
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    window.addEventListener('load', hydrateFromD1, { once: true });
  }
})();
</script>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  const paymentState=params.get('paystack');
  const reference=params.get('reference');
  if(!paymentState||!reference)return;
  history.replaceState({},'',location.pathname);
  if(paymentState==='failed'){showToast('Paystack payment was not completed.');return;}
  try{
    const response=await fetch(apiUrl('/api/paystack/verify/'+encodeURIComponent(reference)),{cache:'no-store'});
    const payload=await response.json();
    if(!response.ok||!payload.ok||!payload.order)throw new Error(payload.error||'Payment could not be verified.');
    const order=payload.order;
    state.lastOrder={number:order.order_number,total:order.total,payment:'Paystack',items:[]};
    state.cart=[];localStorage.removeItem('eshop-cart');sessionStorage.removeItem('eshop-paystack-pending');state.view='confirmation';render();showToast('Payment confirmed.');
  }catch(err){
    showToast(err.message||'Payment could not be verified.');
  }
})();
</script>
<script>
(() => {
  const baseTitle = 'E SHOP | Independent stores, products and services';
  const baseDescription = 'Shop independent stores, products, gifts and bookable services in one thoughtful E SHOP marketplace.';
  const setMeta = (selector, value, attribute = 'content') => {
    const node = document.querySelector(selector);
    if (node) node.setAttribute(attribute, value);
  };
  const updateSeo = () => {
    const product = state.view === 'detail' ? productById(state.product) : null;
    const store = state.view === 'storefront' ? storeByUser(state.store) : null;
    const title = product ? `${product.name} | ${product.storeName} | E SHOP` : store ? `${store.name} | E SHOP` : baseTitle;
    const description = product
      ? `${product.name} from ${product.storeName}. Shop on E SHOP with secure checkout and local delivery.`
      : store
        ? `${store.name} on E SHOP — discover the store's products, offers and story.`
        : baseDescription;
    const canonical = new URL(location.pathname || '/', location.origin).href;
    document.title = title;
    setMeta('meta[name="description"]', description);
    setMeta('meta[property="og:title"]', title);
    setMeta('meta[property="og:description"]', description);
    setMeta('meta[property="og:url"]', canonical);
    setMeta('meta[name="twitter:title"]', title);
    setMeta('meta[name="twitter:description"]', description);
    setMeta('link[rel="canonical"]', canonical, 'href');
    const graph = [
      { '@type': 'Organization', '@id': `${canonical}#organization`, name: 'E SHOP', url: canonical, logo: new URL('./icon.svg', location.href).href },
      { '@type': 'WebSite', '@id': `${canonical}#website`, name: 'E SHOP', url: canonical, publisher: { '@id': `${canonical}#organization` } }
    ];
    if (product) {
      graph.push({
        '@type': 'Product', name: product.name, image: [product.img], description,
        brand: { '@type': 'Brand', name: product.storeName },
        offers: { '@type': 'Offer', priceCurrency: 'KES', price: Number(product.price) || 0, availability: productIsVisible(product) ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock', url: canonical }
      });
    } else if (store) {
      graph.push({ '@type': 'Organization', name: store.name, description: store.desc, image: store.logo, url: canonical });
    } else {
      graph.push({ '@type': 'OnlineStore', name: 'E SHOP', url: canonical, description: baseDescription });
    }
    const schema = document.querySelector('#site-schema');
    if (schema) schema.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': graph });
  };
  const originalRender = render;
  render = function seoAwareRender() {
    originalRender();
    updateSeo();
  };
  updateSeo();
})();
</script>
